<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Ruan</title>
    <link href="./style.css" rel="stylesheet">
</head>

<body>
    <header>
        <img src="./ruan.jpg" alt="Foto do Ruan">
        <h3>Oi, eu sou o Ruan! Bem-vindo ao meu Portfólio</h3>
    </header>

    <div class="container">

        <div class="card">
            <div class="frontofcard">
                <h2>Sobre Mim</h2>
            </div>
            <div class="backofcard">
                <h3>Quem sou eu:</h3>
                <ul>
                    <li>Oi o meu nome é Ruan Felix e tenho 15 anos</li>
                    <li>Eu tenho só um pouco de falta de atenção</li>
                </ul>
            </div>
        </div>

        <div class="card">
            <div class="frontofcard">
                <h2>Informática</h2>
            </div>
            <div class="backofcard">
                <h3>Aprendendo:</h3>
                <ul>
                    <li>HTML / CSS</li>
                    <li>JavaScript</li>
                </ul>
            </div>
        </div>
    </div>

    <footer>
        <p>Feito por Ruan</p>
    </footer>
</body>

</html>
